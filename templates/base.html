<!DOCTYPE html>
<html lang="en">

<head>
  <title>{{title}}</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css">

  <!-- favicon generated by https://realfavicongenerator.net/ -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
  <meta name="msapplication-TileColor" content="#da532c">
  <meta name="theme-color" content="#ffffff">
</head>

<body>

  <div class="site-header home-header">
    <h1 class="home-title">
      <a class="page-link" href="index.html">jmglov's website</a>
    </h1>
    <div class="home-nav">
      <h3 class="page-link">
        <a class="page-link" href="blog/">Blog</a>
      </h3>
      <a class="page-link" href="https://www.linkedin.com/in/joshglover" target="_blank">
        <img class="page-icon" src="{{assets-dir}}/linkedin-30px.png" alt="LinkedIn logo"
          title="LinkedIn profile" />
      </a>
      <a class="page-link" href="https://bsky.app/profile/jmglov.bsky.social" target="_blank">
        <img class="page-icon" src="{{assets-dir}}/bluesky.svg" alt="Bluesky logo" title="Bluesky profile" />
      </a>
      <a class="page-link" href="https://codeberg.org/jmglov" target="_blank">
        <img class="page-icon" src="{{assets-dir}}/codeberg.svg" alt="Codeberg logo" title="Codeberg profile" />
      </a>
    </div>
  </div>

  <div class="wrapper home-wrapper">
    {{body | safe }}
{% if maria-files %}
    <ul class="index">
{% for f in maria-files %}
      <li><span><a href="{{f.url}}"> {{f.name}}</a></span></li>
{% endfor %}
    </ul>
{% endif %}
  </div>

</body>

</html>
